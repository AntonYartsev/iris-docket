services:
  iris:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        IRIS_IMAGE: ${IRIS_IMAGE:-intersystemsdc/irishealth-community:2026.2}
        IRIS_PASSWORD: ${IRIS_PASSWORD:-12345}
        IRIS_ADMIN_USER: ${IRIS_ADMIN_USER:-docket}
        IRIS_ADMIN_PASSWORD: ${IRIS_ADMIN_PASSWORD:-${IRIS_PASSWORD:-12345}}
    image: docket:latest
    container_name: docket
    ports:
      - "${IRIS_PORT:-52773}:52773"
    environment:
      IRIS_INIT: "1"
      IRIS_ADMIN_USER: ${IRIS_ADMIN_USER:-docket}
      IRIS_ADMIN_PASSWORD: ${IRIS_ADMIN_PASSWORD:-${IRIS_PASSWORD:-12345}}
      LLM_MODE: ${LLM_MODE:-mock}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_MODELS: ${OPENROUTER_MODELS:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:52773/portal/index.html"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
